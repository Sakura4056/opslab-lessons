                      # ⭐ 每次改配置后必跑：语法检查\nsudo systemctl reload nginx           # 平滑加载（不断连接）\n\n# 静态站点\nsudo mkdir -p /var/www/app && echo '<h1>hello nginx<\/h1>' | sudo tee /var/www/app/index.html\nsudo vim /etc/nginx/conf.d/app.conf   # 写入上面的 server 配置\ncurl -H \"Host: app.local\" http://127.0.0.1/     # 用 Host 头模拟域名访问\n\n# 反向代理验证（后端用 python 模拟）\npython3 -m http.server 8000 &         # 简易后端\ncurl http://127.0.0.1/api/            # 经 nginx → 后端\n\n# 日志\nsudo tail -f /var/log/nginx/access.log    # 看访问：IP 状态码 路径 UA\nsudo tail -f /var/log/nginx/error.log     # 看错误：配置错/后端不通都在这\n```\n\n## 动手实验\n\n- [ ] 安装 nginx，`curl 127.0.0.1` 看默认页\n- [ ] 建静态站点：conf.d/app.conf + index.html，`nginx -t && reload`，curl 验证 200\n- [ ] 配 `/api/` 反代到 python http.server，curl 验证返回内容来自后端\n- [ ] 故意写错配置（如缺分号）体验 `nginx -t` 报错与 reload 拒绝\n- [ ] access.log 里找到自己的请求，说出每一列含义\n\n## 常见坑\n\n- **403 Forbidden**：root 目录权限（nginx worker 无 x 权限）或 index 文件缺失；\n- **改配置只 reload 不 -t**：语法错时 reload 拒绝加载，你以为生效了其实没有；\n- **proxy_pass 末尾斜杠**：`/api/` 与 `http://backend/api`、`http://backend` 拼接行为不同——改完用 curl 实测；\n- **server_name 冲突**：同端口同 server_name 只生效第一个；用 `nginx -T`（大写）导出全部生效配置查重。\n\n## 自测\n\n1. `nginx -t` 和 `systemctl reload` 分别做什么？\n2. 写出「把 /api/ 转发到 127.0.0.1:8000 并保留真实 IP」的 location 配置。\n3. 403 排查的两个方向？\n4. 502 出现时先看哪个日志？\n\n## 延伸\n\n- 快照：[[2026-11-07_入门资料清单|Nginx 官方文档]]、[[小林coding_快照索引|HTTP 相关]]\n- 下一讲：数据层 → [[阶段4_服务实战/02_MySQL安装与日常运维|MySQL安装与日常运维]]\n\n---\n*相邻：[[阶段3_Shell脚本/04_综合实战_备份与巡检脚本|← 上一讲]] ｜ [[阶段4_服务实战/02_MySQL安装与日常运维|下一讲 →]]*\n", "lessons/阶段4_服务实战/02_MySQL安装与日常运维.md": "---\n类型: 学习讲义\n阶段: 4\n标签: [学习讲义, MySQL, 数据库]\n---\n\n# MySQL 安装与日常运维\n\n> 阶段笔记：[[阶段4_服务实战]] ｜ 上一讲：[[阶段4_服务实战/01_Nginx安装与配置|Nginx安装与配置]] ｜ 下一讲：[[阶段4_服务实战/03_Redis入门与持久化|Redis入门与持久化]]\n> 运维不写业务 SQL，但**装库、建账号、备份、看慢查询**全是活。\n\n## 学习目标\n\n- 安装 MySQL 8.x 并完成安全初始化\n- 会建库/建用户/授权（最小权限原则）\n- 会 mysqldump 备份与恢复，会开慢查询日志\n\n## 核心概念\n\n| 概念 | 说明 |\n|---|---|\n| 端口 | 默认 3306；my.cnf 可改 |\n| root 密码 | 安装后初始化；生产用强密码+密钥管理 |\n| 权限模型 | 用户@主机 粒度授权（`dev@'10.0.0.%'`） |\n| my.cnf | /etc/mysql/mysql.conf.d/mysqld.cnf（Ubuntu） |\n| 慢查询日志 | slow_query_log=ON，long_query_time 阈值 |\n\n**权限最小权限原则**：应用账号只给需要的库+需要的操作（SELECT,INSERT,UPDATE,DELETE），绝不给 ALL。\n\n## 命令实操\n\n### 安装与初始化\n\n```bash\nsudo apt install -y mysql-server\nsudo systemctl enable --now mysql\nsudo mysql_secure_installation        # 交互式安全加固（删匿名用户、禁远程root）\nmysql --version\nsudo systemctl status mysql\n```\n\n### 建库建用户（最常用三板斧）\n\n```sql\n-- sudo mysql 进入（Ubuntu root 走 socket 免密）\nCREATE DATABASE appdb DEFAULT CHARACTER SET utf8mb4;\nCREATE USER 'app'@'10.0.0.%' IDENTIFIED BY '强密码Aa123!';\nGRANT SELECT,INSERT,UPDATE,DELETE ON appdb.* TO 'app'@'10.0.0.%';\nFLUSH PRIVILEGES;\nSHOW GRANTS FOR 'app'@'10.0.0.%';     -- 复核权限\n```\n\n### 备份与恢复（运维核心职责）\n\n```bash\n# 备份整库\nmysqldump -u root -p --single-transaction appdb > appdb_$(date +%F).sql\n# --single-transaction：InnoDB 一致性快照，不锁表（生产必加）\n\n# 恢复\nmysql -u root -p appdb < appdb_2026-01-01.sql\n# 验证：备份文件能 restore 才叫备份成功（同阶段 3 恢复演练原则）\n```\n\n### 慢查询日志\n\n```bash\nsudo tee /etc/mysql/mysql.conf.d/slow.cnf <<'CONF'\n[mysqld]\nslow_query_log = ON\nslow_query_log_file = /var/log/mysql/slow.log\nlong_query_time = 1\nCONF\nsudo systemctl restart mysql\n# 之后用 awk/工具分析 slow.log，问\"为什么慢\"交给开发 + EXPLAIN\n```\n\n## 动手实验\n\n- [ ] 安装 MySQL，完成 secure_installation，记录端口与数据目录（`/var/lib/mysql`）\n- [ ] 建库 appdb + 用户 app@'localhost'，只授 CRUD；用 app 登录验证：能读、不能 DROP\n- [ ] 建一张表插 3 行数据 → mysqldump 备份 → DROP DATABASE → 恢复 → 验证数据回来\n- [ ] 开慢查询日志，执行 `SELECT SLEEP(2);`，在 slow.log 里找到这条记录\n\n## 常见坑\n\n- **root 远程开放**：secure_installation 里已禁；万不得已也用 SSH 隧道；\n- **备份没含 --single-transaction**：锁全表，业务抖动；\n- **字符集**：建库显式 utf8mb4，否则中文/emoji 乱码返工；\n- **密码硬编码在脚本里**：用 `~/.my.cnf`（chmod 600）或环境变量传递；\n- **磁盘满**：binlog 会吃磁盘，定期检查（阶段 5 的监控会覆盖）。\n\n## 自测\n\n1. 授权 `app@'10.0.0.%'` 里的主机部分是什么含义？\n2. mysqldump 的 `--single-transaction` 解决什么问题？\n3. 慢查询日志怎么开？定位到慢 SQL 后给开发什么信息？\n4. 为什么建库要显式指定 utf8mb4？\n\n## 延伸\n\n- 快照：[[小林coding_快照索引|《图解MySQL》索引/事务/锁]]（面试重点）、[[2026-11-07_入门资料清单|MySQL 官方文档]]\n- 下一讲：缓存层 → [[阶段4_服务实战/03_Redis入门与持久化|Redis入门与持久化]]\n\n---\n*相邻：[[阶段4_服务实战/01_Nginx安装与配置|← 上一讲]] ｜ [[阶段4_服务实战/03_Redis入门与持久化|下一讲 →]]*\n", "lessons/阶段4_服务实战/03_Redis入门与持久化.md": "---\n类型: 学习讲义\n阶段: 4\n标签: [学习讲义, Redis, 缓存]\n---\n\n# Redis 入门与持久化\n\n> 阶段笔记：[[阶段4_服务实战]] ｜ 上一讲：[[阶段4_服务实战/02_MySQL安装与日常运维|MySQL安装与日常运维]] ｜ 下一讲：[[阶段4_服务实战/04_LNMP串联实战|LNMP串联实战]]\n> Redis = 内存键值数据库。运维关心：**装得起、连得上、持久化策略、别把内存撑爆**。\n\n## 学习目标\n\n- 安装 Redis 并用 redis-cli 完成五大数据类型基本操作\n- 理解 RDB 与 AOF 两种持久化的取舍（面试高频）\n- 会配置内存上限与淘汰策略，会看 INFO 关键指标\n\n## 核心概念\n\n| 持久化 | 机制 | 优点 | 缺点 |\n|---|---|---|---|\n| RDB | 定时把内存**快照**落盘（dump.rdb） | 文件小、恢复快 | 两次快照间的数据可能丢 |\n| AOF | **追加**每条写命令（appendonly.aof） | 丢失少（每秒/每命令刷盘） | 文件大、恢复慢 |\n\n生产常见组合：**RDB + AOF 同时开**（AOF 保数据，RDB 加速恢复）。\n\n**内存淘汰策略**（maxmemory 满了怎么办）：`noeviction`(默认，写报错) / `allkeys-lru`(最常用) / `volatile-lru`(只淘汰有过期时间的) 等。\n\n## 命令实操\n\n```bash\nsudo apt install -y redis-server\nsudo systemctl enable --now redis-server\nredis-cli                          # 进入交互\n```\n\n```redis\nPING                               # → PONG 连通性\nSET greeting \"hello\" EX 60         # 写入并 60 秒过期\nGET greeting                       # 读\nDEL greeting\n\n-- 五大数据类型速览\nRPUSH queue a b c                  # List：队列\nSADD tags \"linux\" \"ops\"            # Set：去重集合\nHSET user:1 name li age 28         # Hash：对象\nZADD rank 100 alice 90 bob         # ZSet：带分数排序（排行榜）\nTYPE rank\n\nKEYS *                             # ⚠ 生产禁用（阻塞）；用 SCAN\nTTL greeting                       # 剩余过期秒数（-1 永不过期，-2 不存在）\nINFO memory | grep -E \"used_memory_human|maxmemory\"\nINFO stats | grep -i keyspace\nCONFIG GET maxmemory               # 查配置（CONFIG SET 可动态改）\n```\n\n### 持久化与内存配置（/etc/redis/redis.conf）\n\n```conf\nmaxmemory 256mb\nmaxmemory-policy allkeys-lru\nappendonly yes\nsave \"900 1\"                       # RDB：900 秒内 1 次修改触发快照\n```\n\n改完 `sudo systemctl restart redis-server`；数据落盘位置 `/var/lib/redis/`。\n\n## 动手实验\n\n- [ ] 五大类型各完成一次写入/读取/删除，用 TYPE 确认类型\n- [ ] SET 一个 60 秒过期的 key，两次 TTL 观察倒数\n- [ ] 开启 AOF，写入数据，`systemctl restart redis-server` 后数据仍在（持久化生效）\n- [ ] 设 `maxmemory 10mb` 并灌数据，观察淘汰策略行为后改回\n- [ ] `redis-cli INFO memory` 记录 used_memory_human\n\n## 常见坑\n\n- **KEYS * 在生产**：百万 key 时阻塞 Redis 数秒——用 SCAN 迭代；\n- **没设 maxmemory**：内存吃满触发 OOM；缓存场景必须配淘汰策略；\n- **RDB 写入失败**：磁盘满/权限会导致快照失败，monitor 里看 \"BGSAVE\" 报错；\n- **缓存三兄弟**（雪崩/击穿/穿透）：面试题，原理见 [[小林coding_快照索引|《图解Redis》缓存问题篇]]。\n\n## 自测\n\n1. RDB 和 AOF 的取舍？生产怎么组合？\n2. allkeys-lru 和 volatile-lru 区别？纯缓存选哪个？\n3. 为什么生产禁用 KEYS *？\n4. 如何验证持久化真的生效？\n\n## 延伸\n\n- 快照：[[小林coding_快照索引|《图解Redis》持久化/缓存问题]]\n- 下一讲：串起 Nginx+MySQL+Redis+应用 → [[阶段4_服务实战/04_LNMP串联实战|LNMP串联实战]]\n\n---\n*相邻：[[阶段4_服务实战/02_MySQL安装与日常运维|← 上一讲]] ｜ [[阶段4_服务实战/04_LNMP串联实战|下一讲 →]]*\n", "lessons/阶段4_服务实战/04_LNMP串联实战.md": "---\n类型: 学习讲义\n阶段: 4\n标签: [学习讲义, 实战, LNMP]\n---\n\n# LNMP 串联实战\n\n> 阶段笔记：[[阶段4_服务实战]] ｜ 上一讲：[[阶段4_服务实战/03_Redis入门与持久化|Redis入门与持久化]] ｜ 下一讲：[[阶段4_服务实战/05_运维方案_备份监控与安全|运维方案]]\n> **简历项目①的主体**：把 Nginx + 应用 + MySQL + Redis 串成一个真实可访问的服务。\n\n## 学习目标\n\n- 完整跑通「Nginx → Flask 应用 → MySQL/Redis」链路\n- 用 systemd 管理应用进程（生产形态）\n- 形成可复现的部署文档（这是项目①的交付物核心）\n\n## 架构图\n\n```\n浏览器 ──→ Nginx :80 ──┬── /          → 静态页\n                       └── /api/*     → Flask :8000 ──→ MySQL :3306\n                                                    └─→ Redis :6379\n```\n\n## 命令实操\n\n### 1. 准备应用（Flask + Redis + MySQL）\n\n```bash\nsudo apt install -y python3-pip python3-venv\npython3 -m venv /opt/app/venv\n/opt/app/venv/bin/pip install flask redis mysql-connector-python\n\nmkdir -p /opt/app && vim /opt/app/app.py\n```\n\n```python\n# /opt/app/app.py — 最小可用应用：计数器走 Redis，数据落 MySQL\nfrom flask import Flask, jsonify\nimport redis, mysql.connector\n\napp = Flask(__name__)\nr = redis.Redis(host=\"127.0.0.1\", port=6379, decode_responses=True)\ndb = mysql.connector.connect(host=\"127.0.0.1\", user=\"app\", password=\"密码\",\n                             database=\"appdb\")\n\n@app.route(\"/\")\ndef index():\n    return \"<h1>LNMP 实验站<\/h1><a href='/api/visit'>/api/visit<\/a>\"\n\n@app.route(\"/api/visit\")\ndef visit():\n    visits = r.incr(\"visits\")            # Redis 计数\n    cur = db.cursor()\n    cur.execute(\"INSERT INTO visits(ts) VALUES (NOW())\")\n    db.commit()\n    return jsonify({\"visits\": visits, \"stored\": True})\n```\n\n### 2. systemd 托管应用（生产形态）\n\n```bash\nsudo tee /etc/systemd/system/flaskapp.service > /dev/null <<'UNIT'\n[Unit]\nDescription=Flask LNMP Demo\nAfter=network.target mysql.service redis-server.service\n\n[Service]\nUser=www-data\nWorkingDirectory=/opt/app\nExecStart=/opt/app/venv/bin/gunicorn -w 2 -b 127.0.0.1:8000 app:app\nRestart=on-failure\n\n[Install]\nWantedBy=multi-user.target\nUNIT\n/opt/app/venv/bin/pip install gunicorn   # 生产 WSGI 服务器（替代内置 dev server）\nsudo systemctl daemon-reload\nsudo systemctl enable --now flaskapp\n```\n\n### 3. Nginx 反代与验证\n\n```nginx\n# /etc/nginx/conf.d/app.conf 的 location /api/ 指向 127.0.0.1:8000（阶段 4 第 1 讲）\n```\n\n```bash\ncurl http://127.0.0.1/api/visit     # 反复调用，visits 递增\nredis-cli GET visits                # 验证 Redis 计数\n```\n\n## 动手实验（项目①主任务）\n\n- [ ] 按 1~3 全步骤搭通，`curl /api/visit` 成功且数据双写（Redis+MySQL）\n- [ ] 建表：`CREATE TABLE visits(id INT AUTO_INCREMENT PRIMARY KEY, ts DATETIME);`\n- [ ] 压测雏形：`for i in $(seq 1 50); do curl -s http://127.0.0.1/api/visit > /dev/null; done` 后核对计数\n- [ ] 断链实验：`systemctl stop redis-server` 再 curl，观察 500 → 记录 error.log 表现 → 恢复\n- [ ] **写部署文档** `06_Projects\\lnmp\\部署文档.md`：架构图、每步命令、验证方法、故障记录\n\n## 常见坑\n\n- **Flask 自带 server 别用于生产**：单线程调试用，生产用 gunicorn（如上）；\n- **权限混乱**：应用文件 owner 给 www-data，别全 777；\n- **连接信息硬编码**：用环境变量/systemd Environment= 传递；\n- **改了代码不重启**：gunicorn 不会热加载，`systemctl restart flaskapp`。\n\n## 自测\n\n1. 这套链路里每一跳的作用与端口？\n2. 为什么用 gunicorn 替代 flask 内置服务器？\n3. Redis 挂了应用什么表现？你会怎么排（提示：阶段 2 排错法 + error.log）？\n\n## 延伸\n\n- 项目产出目录：`06_Projects\\lnmp\\`（阶段 4 结束时打 git tag）\n- 下一讲：给这套系统配齐「备份/监控/安全」→ [[阶段4_服务实战/05_运维方案_备份监控与安全|运维方案]]\n\n---\n*相邻：[[阶段4_服务实战/03_Redis入门与持久化|← 上一讲]] ｜ [[阶段4_服务实战/05_运维方案_备份监控与安全|下一讲 →]]*\n", "lessons/阶段4_服务实战/05_运维方案_备份监控与安全.md": "---\n类型: 学习讲义\n阶段: 4\n标签: [学习讲义, 运维方案, 安全, 监控]\n---\n\n# 运维方案：备份、监控与安全\n\n> 阶段笔记：[[阶段4_服务实战]] ｜ 上一讲：[[阶段4_服务实战/04_LNMP串联实战|LNMP串联实战]] ｜ 下一阶段：[[阶段5_Docker与自动化/01_Docker核心概念与命令|Docker核心概念与命令]]\n> 项目①的收尾：服务能跑只是及格，**有备份、有监控、有安全基线**才算完整方案。\n\n## 学习目标\n\n- 为 LNMP 环境落地「数据库备份 + 配置备份」的定时任务\n- 建立基础资源监控（无需 Prometheus，先会用系统自带 + 简单脚本）\n- 完成安全基线：防火墙、SSH 加固、最小暴露面\n\n## 核心概念\n\n### 安全基线四件事（服务器裸奔 = 事故预定）\n\n```\n① 防火墙：只开必要端口（ufw）\n② SSH：禁 root 密码登录、改端口、用密钥\n③ 更新：apt 定期 upgrade + unattended-upgrades 自动安全更新\n④ 暴露面：服务只监听必要地址；数据库绝不绑 0.0.0.0 对公网\n```\n\n## 命令实操\n\n### 1. 备份方案（复用阶段 3 技能）\n\n```bash\n# 数据库每日备份：sudo crontab -e\n30 2 * * * mysqldump -uroot -p'密码' --single-transaction appdb \\\n  | gzip > /var/backups/mysql/appdb_$(date +\\%F).sql.gz\n# 注意 crontab 里 % 要转义为 \\%\n\n# 配置备份：/etc/nginx /etc/systemd/system /opt/app\n0 3 * * * tar -czf /var/backups/conf/conf_$(date +\\%F).tar.gz /etc/nginx /etc/systemd/system\n```\n\n### 2. 基础监控（无监控组件时的土办法）\n\n```bash\n# 磁盘告警脚本（>85% 输出告警行），挂 cron 每 10 分钟\ndf -h | awk '$5+0 > 85 {print \"DISK WARN:\", $6, $5}'\n\n# 服务存活巡检：挂 cron 每 5 分钟，挂了自动拉起\nsystemctl is-active --quiet flaskapp || sudo systemctl restart flaskapp\n\n# 进阶预告：真正的监控体系 = Prometheus(采集) + Grafana(看板) + Alertmanager(告警)\n#            日志集中 = ELK/EFK —— 阶段 5 讲概念，入职后深入\n```\n\n### 3. 防火墙与 SSH 加固\n\n```bash\nsudo apt install -y ufw\nsudo ufw allow 22/tcp          # 先放行 SSH 再 enable，防自锁！\nsudo ufw allow 80,443/tcp\nsudo ufw enable && sudo ufw status verbose\n\n# SSH 加固（/etc/ssh/sshd_config）：\n#   PermitRootLogin no           禁 root 直接登录\n#   PasswordAuthentication no    仅密钥登录（先确保密钥能连！）\n#   Port 2222                    可选：改端口减少扫描噪音\nsudo systemctl restart ssh\n```\n\n## 动手实验（项目①运维方案章节）\n\n- [ ] 落两条备份 cron 并各手动验证一次（含恢复演练）\n- [ ] 启用 ufw：仅放行 22/80/443；验证 curl 外部端口被拒、SSH 仍可连\n- [ ] 修改 sshd 禁止 root 密码登录，用普通用户+密钥验证登录成功\n- [ ] 写「磁盘告警 + 服务自动拉起」两个 cron 并故意停服务验证拉起\n- [ ] 把以上全部整理进 `06_Projects\\lnmp\\` 的运维方案文档，git 打 tag：`v1.0-运维方案`\n\n## 常见坑\n\n- **ufw enable 前没放行 22**：云主机直接把自己锁外面（有控制台还能救）；\n- **sshd 改配置先开新连接测试**：旧会话别断，确认新配置能连再关旧会话；\n- **备份存本机**：服务器挂 = 备份也没了，至少再传一份到对象存储/其他机器；\n- **监控告警无人看**：告警要有人响应才有意义，宁可少而准。\n\n## 自测\n\n1. 服务器安全基线四件事？\n2. crontab 里 `%` 为什么要转义？\n3. 服务自动拉起脚本的核心判断语句怎么写？\n4. 「有空间但备份失败」可能的两个原因？\n\n## 延伸\n\n- 项目①完成 → 用 `git tag` 固化，再进入容器化 → [[阶段5_Docker与自动化/01_Docker核心概念与命令|Docker核心概念与命令]]\n- 快照：[[小林coding_快照索引|《图解系统/网络》排错篇]]\n\n---\n*相邻：[[阶段4_服务实战/04_LNMP串联实战|← 上一讲]] ｜ [[阶段5_Docker与自动化/01_Docker核心概念与命令|下一讲 →]]*\n", "lessons/阶段4_服务实战/06_Nginx HTTPS与证书.md": "---\n类型: 学习讲义\n阶段: 4\n标签: [学习讲义, Nginx, HTTPS, 证书]\n---\n\n# Nginx HTTPS 与证书\n\n> 阶段笔记：[[阶段4_服务实战]] ｜ 上一讲：[[阶段4_服务实战/05_运维方案_备份监控与安全|运维方案]] ｜ 下一讲：[[阶段5_Docker与自动化/01_Docker核心概念与命令|Docker核心概念与命令]]\n> 运维高频任务：**给站点上 HTTPS**——自签用于内网/练习，Let's Encrypt 用于公网。\n\n## 学习目标\n\n- 用 openssl 自签证书配出可用 HTTPS 站点（本地练习）\n- 理解证书链与浏览器校验失败的原因\n- 掌握 HTTP→HTTPS 强制跳转与 HSTS；了解 Let's Encrypt/certbot 流程\n\n## 核心概念\n\n```\n证书内容：域名(SAN) + 有效期 + 公钥 + 签发者(CA) 签名\n信任链：  根CA → 中级CA → 服务器证书（浏览器内置根CA 列表）\n自签证书：自己当 CA——浏览器不信任（测内网可用，公网用 Let's Encrypt）\n```\n\n| 方案 | 适用 | 有效期 |\n|---|---|---|\n| openssl 自签 | 内网/练习/测试环境 | 自定 |\n| Let's Encrypt (certbot) | 公网域名（需 DNS 可控） | 90 天，自动续期 |\n\n## 命令实操\n\n### 1. 自签证书（一条命令生成 key+证书）\n\n```bash\nsudo mkdir -p /etc/nginx/ssl\nsudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \\\n  -keyout /etc/nginx/ssl/app.key \\\n  -out /etc/nginx/ssl/app.crt \\\n  -subj \"/CN=app.local\"\n```\n\n### 2. HTTPS 站点 + 强制跳转\n\n```nginx\n# /etc/nginx/conf.d/app.conf\nserver {                          # HTTP → HTTPS 跳转\n    listen 80;\n    server_name app.local;\n    return 301 https://$host$request_uri;\n}\nserver {\n    listen 443 ssl;\n    server_name app.local;\n    root /var/www/app;\n    ssl_certificate     /etc/nginx/ssl/app.crt;\n    ssl_certificate_key /etc/nginx/ssl/app.key;\n    ssl_protocols       TLSv1.2 TLSv1.3;     # 禁用老旧协议\n    ssl_ciphers         HIGH:!aNULL:!MD5;\n}\n```\n\n```bash\nsudo nginx -t && sudo systemctl reload nginx\ncurl -k https://127.0.0.1/            # -k 忽略自签证书告警（仅测试用）\ncurl -sI http://127.0.0.1/ | head -3  # 应看到 301 → https\n```\n\n### 3. 证书检查（巡检脚本素材）\n\n```bash\nopenssl x509 -in /etc/nginx/ssl/app.crt -noout -dates -subject\n# 远程站点（含剩余天数）：\necho | openssl s_client -connect target.com:443 2>/dev/null \\\n  | openssl x509 -noout -enddate\n```\n\n### 4. Let's Encrypt（公网流程认知）\n\n```bash\nsudo apt install -y certbot python3-certbot-nginx\nsudo certbot --nginx -d yourdomain.com        # 自动改 nginx 配置 + 申请\nsudo certbot renew --dry-run                  # 续期演练（certbot 自动挂了续期任务）\n```\n\n## 动手实验\n\n- [ ] 自签证书 + HTTPS server 配置，`curl -k https://127.0.0.1/` 返回 200\n- [ ] 不加 `-k` 看报错信息（自签不被信任，理解证书链校验）\n- [ ] HTTP 访问验证 301 跳转到 HTTPS\n- [ ] 用 openssl 查自己证书的 SAN/有效期；写一条「证书剩余天数」巡检命令入库\n\n## 常见坑\n\n- **证书域名不匹配**：浏览器报 NET::ERR_CERT_COMMON_NAME_INVALID——SAN 里必须有访问域名；\n- **443 未放行**：ufw/安全组记得 allow 443；\n- **私钥权限**：app.key 应 600 且属主 root，泄漏=可伪造你的站点；\n- **certbot 申请失败**：80 端口需可达 + DNS 已指向本机（公网流程的前提）。\n\n## 自测\n\n1. 自签证书和 Let's Encrypt 证书的本质区别？\n2. HTTPS server 块中三行 ssl 配置各是什么？\n3. 如何用一条命令查远程站点证书的到期时间？\n4. 为什么 80 端口要保留 301 跳转而不是直接关掉？\n\n## 延伸\n\n- 讲义：[[阶段4_服务实战/01_Nginx安装与配置|Nginx安装与配置]]、[[阶段2_网络基础/04_HTTP与HTTPS|HTTP与HTTPS]]\n- 快照：[[小林coding_快照索引|《图解网络》HTTPS/TLS 握手篇]]\n\n---\n*相邻：[[阶段4_服务实战/05_运维方案_备份监控与安全|← 上一讲]] ｜ [[阶段5_Docker与自动化/01_Docker核心概念与命令|下一讲 →]]*\n", "lessons/阶段4_服务实战/99_阶段4测试卷.md": "---\n类型: 阶段测试卷\n阶段: 4\n标签: [学习讲义, 测试, Nginx, MySQL, Redis]\n---\n\n# 阶段 4 测试卷：服务实战\n\n> 时量建议 75 分钟。实操部分**在你的 LNMP 环境真实执行**并留证据（命令输出）。\n\n## 一、简答（每题 5 分，共 40 分）\n\n1. `nginx -t`、`systemctl reload`、`restart` 三者的动作差异？改完配置的标准动作序列？\n2. 403 Forbidden 在 nginx 场景的两个常见原因与排查命令？\n3. MySQL 建应用账号的最小权限原则怎么落地？写出给 `app` 授权 appdb CRUD 的 SQL。\n4. `mysqldump --single-transaction` 解决什么问题？\n5. RDB 与 AOF 的取舍？生产环境推荐组合？\n6. Redis 的 maxmemory 满了之后有哪些淘汰策略？纯缓存场景选哪个？\n7. gunicorn 相比 Flask 内置服务器的意义？`-w 2` 是什么？\n8. 服务器安全基线四件事？\n\n## 二、实操（每题 10 分，共 40 分）\n\n9. 新建静态站点 `demo.local`：自签证书上 HTTPS + 80 强制 301 跳转 + `curl` 三连验证（http 301 / https 200 / 错误域名 404）。\n10. 建库 `testdb`、用户 `tester`@localhost 仅 SELECT 权限；验证 tester 不能 CREATE；然后删除该用户。\n11. mysqldump 备份 testdb → 删库 → 恢复 → 查询验证数据完整（全过程记录命令）。\n12. 停掉 Redis，`curl /api/visit` 观察现象与 error.log，恢复 Redis，服务自愈验证。\n\n## 三、场景（每题 10 分，共 20 分）\n\n13. 周日早上收到告警：网站 503。写出你的完整排查与处置流程（含对外沟通话术要点）。\n14. 备份任务连续三天失败，日志显示 `mysqldump: Got error: 1045`——分析原因并给出修复与防复发方案。\n\n---\n\n## 参考答案要点\n\n**1.** -t 只验语法；reload 平滑加载；restart 中断重起。序列：改配置 → nginx -t → reload。（第 01 讲）\n**2.** 目录权限（worker 无 x/r）与 index 缺失；`ls -l /var/www`、`nginx -T` 查看，error.log 有 denied 记录。（第 01 讲）\n**3.** `CREATE USER 'app'@'10.0.0.%' IDENTIFIED BY '强密码'; GRANT SELECT,INSERT,UPDATE,DELETE ON appdb.* TO 'app'@'10.0.0.%';`（第 02 讲）\n**4.** InnoDB 一致性快照备份，避免锁表影响业务。（第 02 讲）\n**5.** RDB 快照恢复快但丢数据窗口大；AOF 追加丢得少但文件大恢复慢；生产两者同开。（第 03 讲）\n**6.** noeviction/allkeys-lru/volatile-lru 等；纯缓存选 allkeys-lru。（第 03 讲）\n**7.** 生产 WSGI 服务器，多 worker 并发与进程管理；-w 2 = 2 个 worker 进程。（第 04 讲）\n**8.** 防火墙最小暴露 / SSH 加固 / 定期更新 / 服务监听收敛。（第 05 讲）\n**9.** 要点：openssl 自签 -CN=demo.local；server 80 返回 301；server 443 ssl 三行配置；`curl -sI http://...` 看 301、`curl -k https://...` 看 200、换域名看 404。（第 06 讲）\n**10.** 建库建用户仅 SELECT → `CREATE` 测试报错 → `DROP USER tester@localhost`。（第 02 讲）\n**11.** dump → `DROP DATABASE` → `CREATE` → `mysql testdb < dump.sql` → `SELECT COUNT(*)` 对比。（第 02 讲）\n**12.** 500/502 出现、error.log 出现 connect refused；`systemctl start redis-server` 后恢复——体验依赖故障。（第 04 讲）\n**13.** 止血（确认范围→回滚/重启/扩容）→ 分层定位（503 来源：nginx 返回还是后端）→ 保留日志现场 → 对外沟通（已知原因/预计恢复/影响范围）→ 复盘补监控。（第 05 讲+阶段 2）\n**14.** 1045=认证失败：cron 环境变量/密码文件权限不对（.my.cnf 600）、或密码被轮换未同步；修复：`~/.my.cnf` 固化凭证 chmod 600；防复发：备份任务加退出码告警。（第 05 讲+阶段 3 cron 坑）\n\n## 评分与处置\n\n≥80 进入阶段 5；实操题必须附真实命令输出才算得分。\n", "lessons/阶段5_Docker与自动化/01_Docker核心概念与命令.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, Docker, 容器]\n---\n\n# Docker 核心概念与命令\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段4_服务实战/05_运维方案_备份监控与安全|阶段4运维方案]] ｜ 下一讲：[[阶段5_Docker与自动化/02_Dockerfile与Compose|Dockerfile与Compose]]\n> 环境基准：Docker Desktop（WSL2 后端）或 WSL 内原生 Engine；命令一律 **Compose v2 风格**。\n\n## 学习目标\n\n- 说清镜像/容器/仓库三者关系与「容器只是进程」的本质\n- 熟练 15 个高频命令覆盖 90% 日常操作\n- 掌握数据卷与端口映射，理解容器为什么「默认易失」\n\n## 核心概念\n\n```\n镜像(image)：只读模板（分层存储，像类）\n容器(container)：镜像的运行实例（像对象；停止 ≠ 删除）\n仓库(registry)：存镜像的地方（Docker Hub / 私有 registry）\n```\n\n**容器本质** = 被 namespace 隔离、被 cgroup 限制资源的一个**进程**。所以：没有 `-d` 它就是前台进程；删容器数据就没了——持久数据必须挂**卷（volume）**。\n\n## 命令实操\n\n```bash\ndocker version && docker info        # 环境确认\ndocker search nginx | head -5        # 搜镜像\n\n# 镜像生命周期\ndocker pull nginx:1.27-alpine        # 拉取（尽量固定版本+alpine 瘦身）\ndocker images                        # 本地镜像列表\ndocker rmi nginx:1.27-alpine         # 删镜像\n\n# 容器生命周期\ndocker run -d --name web -p 8080:80 nginx:1.27-alpine\n#      -d 后台  --name 命名  -p 宿主端口:容器端口\ndocker ps                            # 运行中容器；-a 含已停止\ndocker logs -f --tail 20 web         # ⭐ 看容器日志（最常用）\ndocker exec -it web sh               # 进入容器（alpine 用 sh 不是 bash）\ndocker stop web && docker start web\ndocker rm web                        # 删容器（先 stop）；-f 强删\ndocker inspect web | grep -A5 Mounts # 查容器详情/挂载\ndocker stats                         # 容器资源占用实时视图\n\n# 数据卷（持久化的关键）\ndocker volume create appdata\ndocker run -d --name db -v appdata:/var/lib/mysql -e MYSQL_ROOT_PASSWORD=x mysql:8\ndocker run -d --name web2 -p 8081:80 -v \"$PWD/site:/usr/share/nginx/html\" nginx:1.27-alpine\n#      -v 卷名:容器内路径      绑定挂载：宿主目录:容器内路径（开发常用）\n\n# 清理（磁盘管理日常）\ndocker system df                     # 磁盘占用总览\ndocker system prune -a               # 清理无用容器/镜像/网络（⚠ 确认后再执行）\n```\n\n## 动手实验\n\n- [ ] 拉 nginx 并映射 8080，浏览器访问 `http://localhost:8080`；`logs` 验证访问记录\n- [ ] `exec` 进容器查看 `/usr/share/nginx/html`，改掉 index.html（容器内改动，删容器即失）\n- [ ] 绑定挂载实验：宿主目录放 index.html，容器内立即生效\n- [ ] 卷实验：mysql 容器写数据 → 删容器 → 新容器挂同一卷 → 数据还在\n- [ ] `docker system df` 记录清理前后对比\n\n## 常见坑\n\n- **数据没挂卷**：容器一删数据全丢——数据库类容器必须挂卷；\n- **端口映射方向**：`-p 8080:80` 是「宿主:容器」，别写反；\n- **容器内无 systemd**：容器里跑的是单进程，systemd 那套不适用（一容器一服务）；\n- **镜像 tag 用 latest**：今天和明天的 latest 可能不同——生产固定版本号；\n- **alpine 无 bash**：进容器用 `sh`。\n\n## 自测\n\n1. 镜像、容器、仓库的关系？容器停止和删除的区别？\n2. 为什么数据库容器必须挂卷？两种挂载方式的适用场景？\n3. 进入一个 alpine 容器用什么命令？\n4. 磁盘被 Docker 吃满，第一条清理命令是什么？\n\n## 延伸\n\n- 快照：[[Docker实践_快照索引|全书第 4~9 章与 11 章 Compose]]（深入阅读）\n- 下一讲：把 LNMP 容器化 → [[阶段5_Docker与自动化/02_Dockerfile与Compose|Dockerfile与Compose]]\n\n---\n*相邻：[[阶段4_服务实战/05_运维方案_备份监控与安全|← 上一讲]] ｜ [[阶段5_Docker与自动化/02_Dockerfile与Compose|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/02_Dockerfile与Compose.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, Docker, Dockerfile, Compose]\n---\n\n# Dockerfile 与 Compose\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/01_Docker核心概念与命令|Docker核心概念与命令]] ｜ 下一讲：[[阶段5_Docker与自动化/03_Python运维脚本|Python运维脚本]]\n> 简历项目②核心：**LNMP 容器化改造**——一条 `docker compose up -d` 拉起全套。\n\n## 学习目标\n\n- 掌握 Dockerfile 十个高频指令与分层缓存原理\n- 为阶段 4 的 Flask 应用写出生产级 Dockerfile\n- 用 Compose 编排 nginx+app+mysql+redis 四服务并互相联通\n\n## 核心概念\n\n### Dockerfile 分层缓存\n\n每条指令 = 一层。**变动少的指令写前面**（缓存复用），依赖安装在前、代码拷贝在后。\n\n```dockerfile\n# Dockerfile（放 /opt/app/）\nFROM python:3.12-slim              # 基础镜像：slim 减体积\nWORKDIR /app\nCOPY requirements.txt .            # 先拷依赖清单（不常变 → 缓存命中）\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY app.py .                      # 再拷代码（常变 → 只有这层重建）\nEXPOSE 8000\nUSER www-data                      # 非 root 运行（安全基线）\nCMD [\"gunicorn\", \"-w\", \"2\", \"-b\", \"0.0.0.0:8000\", \"app:app\"]\n# CMD 容器默认启动命令；ENTRYPOINT 固定入口（参数可附加）\n```\n\n### Compose（多容器编排）\n\n```yaml\n# /opt/lnmp/docker-compose.yml\nservices:\n  web:\n    image: nginx:1.27-alpine\n    ports: [\"80:80\"]\n    volumes: [\"./nginx.conf:/etc/nginx/conf.d/app.conf:ro\"]\n    depends_on: [app]\n  app:\n    build: ./app                   # 用上面的 Dockerfile 构建\n    environment: [DB_HOST=db, REDIS_HOST=cache]\n    depends_on: [db, cache]\n  db:\n    image: mysql:8.0\n    environment:\n      MYSQL_ROOT_PASSWORD: rootpw\n      MYSQL_DATABASE: appdb\n    volumes: [\"dbdata:/var/lib/mysql\"]\n  cache:\n    image: redis:7-alpine\nvolumes:\n  dbdata:\n```\n\n服务间用**服务名做主机名**互访（app 连 `db:3306`、`cache:6379`）——Compose 自建网络。\n\n## 命令实操\n\n```bash\ncd /opt/lnmp\ndocker compose build               # 构建镜像\ndocker compose up -d               # ⭐ 一条命令拉起全套（替代阶段 4 手工部署）\ndocker compose ps                  # 四个服务 Up\ndocker compose logs -f app         # 跟某服务日志\ndocker compose exec app sh         # 进容器\ndocker compose down                # 停止并移除（-v 连卷一起删！）\ndocker compose up -d --build       # 改代码后重建部署\n```\n\n## 动手实验（项目②主任务）\n\n- [ ] 给阶段 4 的 Flask 应用写 Dockerfile 并 `docker build`，`docker run` 单容器跑通\n- [ ] 写 Compose 编排四服务，`up -d` 后逐个验证：nginx 首页、/api/visit、redis 计数\n- [ ] 改 app.py 一行代码，`up -d --build` 体会缓存复用（前面的层不重建）\n- [ ] `down -v` 再 `up -d`：数据卷生命周期对比（有 dbdata vs 无）\n- [ ] 项目②文档 `06_Projects\\lnmp容器化\\`：Dockerfile/Compose 讲解 + 与项目①部署方式对比，git tag `v2.0-容器化`\n\n## 常见坑\n\n- **COPY 顺序错误**：代码层在前 → 每次改代码全量重装依赖；\n- **Compose 里 build 的相对路径**：`build: ./app` 相对于 yml 所在目录；\n- **depends_on 只管启动顺序**：不等服务「就绪」，MySQL 刚起 app 就连会报错——应用加重试；\n- **down 忘了卷还在/被删**：`down` 留卷，`down -v` 删卷——删前想清楚；\n- **容器里连 localhost 连不上 MySQL**：要用服务名 `db`。\n\n## 自测\n\n1. Dockerfile 分层缓存怎么利用？COPY 顺序为什么重要？\n2. CMD 和 ENTRYPOINT 的区别？\n3. Compose 服务间如何互相访问？端口映射是给谁用的？\n4. `docker compose down` 与 `down -v` 的差异？\n\n## 延伸\n\n- 快照：[[Docker实践_快照索引|第 7 章 Dockerfile / 第 11 章 Compose]]、[[Kubernetes官方文档|K8s 概念篇（了解定位）]]\n- 下一讲：自动化的另一种手 → [[阶段5_Docker与自动化/03_Python运维脚本|Python运维脚本]]\n\n---\n*相邻：[[阶段5_Docker与自动化/01_Docker核心概念与命令|← 上一讲]] ｜ [[阶段5_Docker与自动化/03_Python运维脚本|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/03_Python运维脚本.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, Python, 自动化]\n---\n\n# Python 运维脚本\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/02_Dockerfile与Compose|Dockerfile与Compose]] ｜ 下一讲：[[阶段5_Docker与自动化/04_Ansible入门|Ansible入门]]\n> 定位：Shell 之外的「重火力」——批量操作、API 调用、复杂逻辑。\n\n## 学习目标\n\n- 会用 requests 调 API 做健康检查，用 subprocess 调本地命令\n- 掌握 paramiko 远程批量执行（跳板机/批量巡检场景）\n- 建立「脚本有异常处理、有日志、可传参」的工程习惯\n\n## 核心概念\n\n| 库 | 场景 | 要点 |\n|---|---|---|\n| requests | HTTP API（健康检查/调云接口） | Session 复用、timeout 必设 |\n| subprocess | 调本地命令（复用 shell 工具） | `capture_output=True, text=True` |\n| paramiko | SSH 远程执行/传文件 | 密钥优先于密码 |\n| 自建 | 日志 + 异常 + 参数 | try/except + logging |\n\n**工具选型**：胶水/循环/解析用 Shell；多主机、API、复杂判断用 Python。\n\n## 命令实操\n\n### 健康检查脚本（requests）\n\n```python\n#!/usr/bin/env python3\n# health_check.py — 批量健康检查并汇总\n# 用法: python3 health_check.py\nimport requests, sys\n\nTARGETS = [\n    \"http://127.0.0.1/\",\n    \"http://127.0.0.1/api/visit\",\n    \"https://www.baidu.com\",\n]\n\ndef check(url):\n    try:\n        r = requests.get(url, timeout=5)\n        return r.status_code, r.elapsed.total_seconds()\n    except requests.RequestException as e:\n        return None, str(e)[:60]\n\nfails = 0\nfor url in TARGETS:\n    code, extra = check(url)\n    ok = code == 200\n    fails += not ok\n    print(f\"[{'OK ' if ok else 'FAIL'}] {code or 'ERR':>5} {extra or ''} {url}\")\nsys.exit(1 if fails else 0)        # 退出码供监控/cron 判断\n```\n\n### 本地命令与远程执行\n\n```python\n# subprocess：复用你已会的 shell 工具\nimport subprocess\nr = subprocess.run([\"df\", \"-h\"], capture_output=True, text=True)\nprint(r.stdout.splitlines()[1])       # 解析输出\n\n# paramiko：批量执行（pip install paramiko）\nimport paramiko\nHOSTS = [(\"10.0.0.11\", \"ops\"), (\"10.0.0.12\", \"ops\")]\nfor host, user in HOSTS:\n    c = paramiko.SSHClient()\n    c.set_missing_host_key_policy(paramiko.AutoAddPolicy())\n    c.connect(host, username=user, key_filename=\"~/.ssh/id_rsa\")\n    _, out, err = c.exec_command(\"uptime && df -h /\")\n    print(f\"== {host} ==\\n{out.read().decode()}\")\n    c.close()\n```\n\n## 动手实验\n\n- [ ] 跑 health_check.py，把其中一个目标改成坏地址观察 FAIL 与退出码\n- [ ] 写 `disk_report.py`：用 subprocess 采集 `df -h`，输出 >80% 的挂载点（结合阶段 1 的 awk 思路）\n- [ ] 用 paramiko 对 WSL 本机 sshd 执行 `uptime`（先在本机装并启动 sshd）\n- [ ] 把三个脚本入库 `03_Scripts\\python\\`，头部注释按规范补全\n\n## 常见坑\n\n- **requests 没 timeout**：卡死线程——永远 `timeout=5`；\n- **异常裸奔**：网络操作必须 try/except，脚本崩了比慢更糟；\n- **subprocess 用 shell=True 拼字符串**：注入风险+难维护，用列表形式；\n- **paramiko 密码硬编码**：用密钥 + 配置文件分离。\n\n## 自测\n\n1. Shell 和 Python 各适合什么场景？两个例子。\n2. requests 为什么必须设 timeout？\n3. paramiko 用什么认证方式最安全？\n4. 监控系统如何利用脚本的退出码？\n\n## 延伸\n\n- 快照：[[廖雪峰Python教程|廖雪峰 Python 基础（语法回顾）]]\n- 下一讲：规模化配置管理 → [[阶段5_Docker与自动化/04_Ansible入门|Ansible入门]]\n\n---\n*相邻：[[阶段5_Docker与自动化/02_Dockerfile与Compose|← 上一讲]] ｜ [[阶段5_Docker与自动化/04_Ansible入门|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/04_Ansible入门.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, Ansible, 自动化]\n---\n\n# Ansible 入门\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/03_Python运维脚本|Python运维脚本]] ｜ 下一讲：[[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]]\n> 一台机器用脚本，**一批机器用 Ansible**——无代理、SSH 直连、幂等执行。\n\n## 学习目标\n\n- 理解 Ansible 三要素：inventory / ad-hoc / playbook\n- 理解「幂等」为什么是配置管理的灵魂\n- 写一个「批量装 Nginx 并启动」的 playbook\n\n## 核心概念\n\n| 概念 | 说明 |\n|---|---|\n| inventory | 主机清单（分组），默认 /etc/ansible/hosts |\n| ad-hoc | 单条命令批量执行：`ansible all -m ping` |\n| playbook | YAML 编排的任务集（生产形态） |\n| 幂等 | 跑一遍和跑十遍结果一致（模块自动判断状态） |\n| 模块 | 内置能力单元：apt/copy/service/template... |\n\n## 命令实操\n\n### 环境与 inventory（本机+WSL 双节点演练）\n\n```bash\nsudo apt install -y ansible\nmkdir -p ~/ansible && vim ~/ansible/hosts\n```\n\n```ini\n# ~/ansible/hosts — inventory\n[webservers]\nlocal ansible_connection=local        # 本机\nwsl   ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ops\n# 前提：本机已 sshd 且 ops 能密钥登录（阶段 4 SSH 加固的成果）\n```\n\n### ad-hoc 快速验证\n\n```bash\ncd ~/ansible\nansible webservers -i hosts -m ping            # 连通性\nansible webservers -i hosts -m command -a \"uptime\"\nansible webservers -i hosts -m apt -a \"name=nginx state=present\" -b   # -b 提权\n```\n\n### playbook：批量装 Nginx\n\n```yaml\n# ~/ansible/nginx.yml\n- hosts: webservers\n  become: yes\n  tasks:\n    - name: 安装 nginx\n      apt: { name: nginx, state: present, update_cache: yes }\n    - name: 部署站点配置\n      copy:\n        content: |\n          server { listen 8080; root /var/www/html; }\n        dest: /etc/nginx/conf.d/ansible-site.conf\n      notify: reload nginx\n    - name: 确保服务运行\n      service: { name: nginx, state: started, enabled: yes }\n  handlers:\n    - name: reload nginx\n      service: { name: nginx, state: reloaded }\n```\n\n```bash\nansible-playbook -i hosts nginx.yml      # 再跑一遍：全部 ok(幂等) 而非 changed\ncurl 127.0.0.1:8080                      # 验证站点\n```\n\n## 动手实验\n\n- [ ] inventory 配两节点，`-m ping` 全绿\n- [ ] 跑 nginx.yml，第二次重跑观察「幂等」（changed → ok）\n- [ ] 故意改坏 copy 内容再跑，体会 notify + handler 的按需触发\n- [ ] playbook 与脚本入库 `03_Scripts\\ansible\\`\n\n## 常见坑\n\n- **inventory 用户/密钥不对**：连不通先 `ansible -m ping` 排 SSH；\n- **忘了 become**：apt/service 类任务失败，报权限错误；\n- **YAML 缩进**：两个空格，别用 Tab；\n- **把 Ansible 当脚本跑**：它管「状态」不是「步骤」——写期望状态，模块自己算差异。\n\n## 自测\n\n1. inventory / ad-hoc / playbook 各是什么？\n2. 幂等性举例说明？为什么重要？\n3. handler 什么时候执行？\n4. `-b` 和 `become: yes` 分别用在哪？\n\n## 延伸\n\n- 快照：[[Ansible中文指南|Ansible 中文指南（playbook 细节）]]\n- 下一讲：监控与 CI/CD 概念（2026 岗位硬要求）→ [[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]]\n\n---\n*相邻：[[阶段5_Docker与自动化/03_Python运维脚本|← 上一讲]] ｜ [[阶段5_Docker与自动化/05_监控与CI_CD概念|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/05_监控与CI_CD概念.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, 监控, Prometheus, CI/CD]\n---\n\n# 监控与 CI/CD 概念\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/04_Ansible入门|Ansible入门]] ｜ 下一阶段：[[阶段6_求职冲刺/01_面试八股速览|面试八股速览]]\n> 2026 招聘硬要求：**会用 Prometheus/Grafana + 懂 CI/CD 流程**。本课讲概念+最小体验，深入留给入职。\n\n## 学习目标\n\n- 讲清监控三件套的分工与数据流\n- 用 Prometheus + Grafana 监控一台主机（容器化 10 分钟体验）\n- 描述一条标准 CI/CD 流水线，动手做一个 GitHub Actions 示例\n\n## 核心概念\n\n### 监控三件套\n\n```\n被监控主机(exporter 暴露 /metrics)\n   → Prometheus 定时拉取并存储时序数据\n   → Grafana 读 Prometheus 画看板\n   → Alertmanager 按规则发告警（分级：警告/严重）\n日志：Filebeat → Elasticsearch → Kibana（ELK/EFK）\n```\n\n| 指标类型 | 例子 | 用途 |\n|---|---|---|\n| CPU/内存/磁盘 | node_exporter | 主机健康 |\n| QPS/延迟/错误率 | 应用或网关 | 服务健康（USE/RED 方法） |\n| 告警规则 | `disk_used > 85% 持续 10m` | 先于用户发现问题 |\n\n### CI/CD 流水线\n\n```\n代码 push → CI 构建+测试（自动）→ 打镜像/产物 → CD 部署（自动/审批）\n工具：GitHub Actions / GitLab CI / Jenkins\n```\n\n## 命令实操\n\n### 最小监控体验（Compose 起 Prometheus + Grafana + node_exporter）\n\n```yaml\n# ~/monitor/docker-compose.yml\nservices:\n  node:\n    image: prom/node-exporter:latest\n    pid: host\n    volumes: [\"/:/host:ro\"]\n    command: [\"--path.rootfs=/host\"]\n  prom:\n    image: prom/prometheus:latest\n    volumes: [\"./prometheus.yml:/etc/prometheus/prometheus.yml:ro\"]\n    ports: [\"9090:9090\"]\n  grafana:\n    image: grafana/grafana:latest\n    ports: [\"3000:3000\"]\n```\n\n```yaml\n# ~/monitor/prometheus.yml\nglobal: { scrape_interval: 15s }\nscrape_configs:\n  - job_name: node\n    static_configs: [{ targets: [\"node:9100\"] }]\n```\n\n```bash\ndocker compose up -d\n# Grafana: http://localhost:3000（admin/admin）→ 添加 Prometheus 数据源(地址 http://prom:9090)\n#          → 导入仪表盘 ID 1860（Node Exporter Full）→ 看到本机 CPU/内存曲线即成功\n# PromQL 体验: 浏览器开 http://localhost:9090 → 查询 100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))*100\n```\n\n### CI/CD 最小体验（GitHub Actions）\n\n```yaml\n# .github/workflows/ci.yml —— 项目②仓库里加\nname: ci\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: 构建 Docker 镜像\n        run: docker build -t myapp:${{ github.sha }} .\n      - name: 冒烟测试\n        run: docker run -d --name t -p 8000:8000 myapp:${{ github.sha }} && sleep 3 && curl -sf localhost:8000/\n```\n\npush 后到仓库 Actions 页看绿色对勾——这就是 CI 的全部直觉。\n\n## 动手实验\n\n- [ ] Compose 起三件套，Grafana 导入 1860 看板并截图进实验日志\n- [ ] PromQL 手查：本机内存使用率、磁盘剩余\n- [ ] 给项目②仓库加 ci.yml，push 触发一次成功构建\n- [ ] 写 5 条告警规则草稿（磁盘/CPU/内存/服务探活/证书有效期）存入项目②文档\n\n## 常见坑\n\n- **告警风暴**：阈值太敏感+无分级——按「警告/严重」分级并收敛；\n- **只监控不排错**：监控答「哪里不对」，日志答「为什么」——两者要能互相跳转；\n- **Grafana 数据源地址**：Compose 内用服务名 `http://prom:9090`，不是 localhost；\n- **CI 跑在别人的机器**：密钥/凭证用平台的 secrets，绝不写进仓库。\n\n## 自测\n\n1. Prometheus/Grafana/Alertmanager 的分工与数据流？\n2. 一条告警规则由哪几部分构成？\n3. CI 和 CD 的分界在哪？为什么要有「审批」？\n4. USE / RED 方法分别监控什么？\n\n## 延伸\n\n- 快照：[[Kubernetes官方文档|K8s 概念篇]]（监控在 K8s 生态的形态：kube-state-metrics 等）\n- 阶段 5 毕业 → [[阶段6_求职冲刺/01_面试八股速览|阶段 6：面试八股速览]]\n\n---\n*相邻：[[阶段5_Docker与自动化/04_Ansible入门|← 上一讲]] ｜ [[阶段6_求职冲刺/01_面试八股速览|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/06_K8s概念与本地体验.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, Kubernetes, kubectl]\n---\n\n# K8s 概念与本地体验\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]] ｜ 下一讲：[[阶段6_求职冲刺/01_面试八股速览|面试八股速览]]\n> 2026 岗位硬要求「会 K8s」——本地用 **Docker Desktop 自带的 Kubernetes** 就能完成全部实操，无需云端。\n\n## 学习目标\n\n- 讲清 Pod / Deployment / Service 三个核心对象的关系\n- 启用 Docker Desktop 内置 K8s，用 kubectl 部署并暴露一个应用\n- 掌握 kubectl 高频命令 10 条，理解「声明式」与自愈\n\n## 核心概念\n\n```\nPod        最小调度单元（1 个或多个容器的组合）\nDeployment 管理 Pod 副本的控制器：声明\"要 3 个副本\"，挂了自动重建\nService    一组 Pod 的稳定访问入口（ClusterIP 集群内 / NodePort 节点暴露）\n```\n\n**声明式 vs 命令式**：Docker 是「跑这个命令」；K8s 是「我要这个最终状态」——控制器持续比对现状与声明并自动修正（自愈、滚动更新、扩缩容的来源）。\n\n## 命令实操\n\n### 1. 启用本地集群\n\nDocker Desktop → Settings → Kubernetes → **Enable Kubernetes** → Apply（等待几分钟）。验证：\n\n```bash\nkubectl get nodes             # docker-desktop 节点 Ready\nkubectl version --short\nkubectl config current-context   # docker-desktop\n```\n\n### 2. 部署一个应用（声明式三步）\n\n```bash\nkubectl create deployment web --image=nginx:1.27-alpine --replicas=2\nkubectl get pods -o wide              # 两个 Pod，各自有 IP\nkubectl expose deployment web --port=80 --type=NodePort\nkubectl get svc web                   # 拿到 NodePort 端口（3xxxx）\ncurl http://localhost:<NodePort>/     # NodePort 端口本机即可访问\n```\n\n### 3. 体验「自愈」与「扩缩容」（K8s 的灵魂）\n\n```bash\nkubectl delete pod <某个pod名>        # 手动杀一个 → 自动重建新的（Replicas 保持 2）\nkubectl scale deployment web --replicas=5\nkubectl get pods -w                   # -w 实时观察滚动\nkubectl rollout restart deployment web\nkubectl rollout undo deployment web   # 回滚（需先有变更历史）\n```\n\n### 4. 用 YAML（声明式的正式形态）\n\n```yaml\n# deploy.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: web }\nspec:\n  replicas: 2\n  selector: { matchLabels: { app: web } }\n  template:\n    metadata: { labels: { app: web } }\n    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.27-alpine\n          ports: [{ containerPort: 80 }]\n```\n\n```bash\nkubectl apply -f deploy.yaml          # apply = 声明式标准动作\n```\n\n## 动手实验\n\n- [ ] 启用内置 K8s，`get nodes` 验证 Ready\n- [ ] 部署 nginx ×2 + NodePort Service，curl 访问\n- [ ] 删除一个 Pod 观察自愈重建；scale 到 5 再回 2\n- [ ] 把上面 deploy.yaml 入库 `03_Scripts\\k8s\\`（阶段 5 交付物）\n- [ ] 用 [[阶段4_服务实战/04_LNMP串联实战|项目①]] 的镜像做一个 Deployment（镜像从 Compose 构建而来）\n\n## 常见坑\n\n- **镜像拉取失败 ImagePullBackOff**：本地构建的镜像 K8s 不认（要在 Docker Desktop 的镜像仓库内，即本机构建即可）；\n- **NodePort 范围**：30000~32767，写 80 会报错；\n- **别把 K8s 当 Compose 用**：K8s 不用 `-p` 端口映射思路，用 Service 抽象；\n- **kubectl 命令记不全**：`kubectl cheat sheet`（官方）+ `kubectl explain pod.spec` 内置文档。\n\n## 自测\n\n1. Pod / Deployment / Service 三者关系与各自职责？\n2. 「声明式」如何带来自愈能力？\n3. 删除一个 Pod 后发生了什么？由哪个组件驱动？\n4. kubectl apply 相比 create 的优势？\n\n## 延伸\n\n- 快照：[[Kubernetes官方文档|K8s 官方中文文档（概念篇）]]\n- 讲义：[[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]]（K8s 生态的监控）\n\n---\n*相邻：[[阶段5_Docker与自动化/05_监控与CI_CD概念|← 上一讲]] ｜ [[阶段5_Docker与自动化/07_EFK日志系统体验|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/07_EFK日志系统体验.md": "---\n类型: 学习讲义\n阶段: 5\n标签: [学习讲义, EFK, 日志, Grafana]\n---\n\n# EFK 日志系统体验\n\n> 阶段笔记：[[阶段5_Docker与自动化]] ｜ 上一讲：[[阶段5_Docker与自动化/06_K8s概念与本地体验|K8s概念与本地体验]] ｜ 下一讲：[[阶段6_求职冲刺/01_面试八股速览|面试八股速览]]\n> JD 常写「熟悉 ELK/EFK」。本课先用**轻量版（Loki+Promtail+Grafana）**做一次完整体验，再讲清 EFK 全量的架构与分工。\n\n## 学习目标\n\n- 讲清日志集中化的架构：采集 → 传输 → 存储 → 查询\n- 用 Docker Compose 跑通一套日志系统并查到容器日志\n- 能对 ELK 与 EFK/Loki 的取舍说出所以然\n\n## 核心概念\n\n```\nEFK：Filebeat(采集) → Elasticsearch(存储+全文检索) → Kibana(查询看板)\nELK：Logstash(采集+加工) 替代 Filebeat\nEFK/Loki（轻量替代）：Promtail(采集) → Loki(仅存标签+索引，不全文索引) → Grafana(查询)\n```\n\n| 方案 | 资源 | 全文检索 | 适用 |\n|---|---|---|---|\n| ELK/EFK | 重（ES 数 GB 内存） | 强 | 日志量大、要复杂检索 |\n| Loki | 轻（只索引标签） | 弱（按标签查） | 容器/K8s 场景，配合监控 |\n\n## 命令实操\n\n### 轻量版：Loki + Promtail + Grafana\n\n```yaml\n# ~/logs/docker-compose.yml\nservices:\n  loki:\n    image: grafana/loki:latest\n    ports: [\"3100:3100\"]\n    command: -config.file=/etc/loki/local-config.yaml\n  promtail:\n    image: grafana/promtail:latest\n    volumes:\n      - /var/lib/docker/containers:/var/lib/docker/containers:ro\n      - /var/run/docker.sock:/var/run/docker.sock:ro\n    command: -config.file=/etc/promtail/config.yml\n  grafana:\n    image: grafana/grafana:latest\n    ports: [\"3001:3000\"]\n```\n\n```bash\ndocker compose up -d\n# Grafana: http://localhost:3001（admin/admin）\n# → Connections → Data sources → 添加 Loki（URL: http://loki:3100）\n# → Explore → Label 选 container → 查询某容器的日志流\n# LogQL 体验：{container=\"web\"} |= \"error\"（按标签过滤+行内关键词）\n```\n\n### 常用查询（LogQL）\n\n```logql\n{container=\"app\"} |= \"ERROR\"              # 含 ERROR 的行\n{container=\"app\"} |= \"GET\" != \"healthz\"   # 排除健康检查噪音\nsum_rate({container=\"app\"}[5m])           # 日志速率（突然暴涨=异常）\n```\n\n### EFK 全量版的架构要点（认知级）\n\n- Filebeat 以 DaemonSet/容器方式跟随日志文件，输出到 ES；\n- ES 按 **索引** 分天存储（`logstash-2026.11.19`），查询用 Kibana 的 KQL；\n- 运维职责：索引生命周期管理（ILM，7 天热/30 天冷后删除，防磁盘满）、分片与副本规划。\n\n## 动手实验\n\n- [ ] Compose 起三件套，Grafana 数据源与 Explore 查询跑通\n- [ ] 找到 nginx 容器的日志流，用 LogQL 过滤出 404 的请求行\n- [ ] 对比：`docker logs`、`docker compose logs`、Grafana 查询三者的适用场景\n- [ ] 写「日志系统选型建议」段落入项目②文档（何时上 ELK、何时 Loki）\n\n## 常见坑\n\n- **Promtail 采不到日志**：挂载路径必须是宿主 docker containers 目录，且容器要 json-file 驱动；\n- **ES 内存**：生产 ES 至少 4GB+ 堆，本地体验别直接上；\n- **日志时间线**：容器时区 UTC，查询时注意时间范围；\n- **只查不删**：无 ILM 时磁盘被日志吃满——保留期必须配置。\n\n## 自测\n\n1. 画出 EFK 的四层组件流。\n2. Loki 为什么比 ES 轻？代价是什么？\n3. LogQL 查「app 容器最近 5 分钟含 ERROR 的日志速率」？\n4. 日志保留期与磁盘管理的关系？\n\n## 延伸\n\n- 讲义：[[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]]（日志+指标=可观测性双支柱）\n- 阶段 5 全部完成 → [[阶段6_求职冲刺/01_面试八股速览|阶段 6：面试八股速览]]\n\n---\n*相邻：[[阶段5_Docker与自动化/06_K8s概念与本地体验|← 上一讲]] ｜ [[阶段6_求职冲刺/01_面试八股速览|下一讲 →]]*\n", "lessons/阶段5_Docker与自动化/99_阶段5测试卷.md": "---\n类型: 阶段测试卷\n阶段: 5\n标签: [学习讲义, 测试, Docker, Ansible, 监控]\n---\n\n# 阶段 5 测试卷：Docker 与自动化\n\n> 时量建议 75 分钟。\n\n## 一、简答（每题 5 分，共 40 分）\n\n1. 镜像分层缓存的利用原则？写出两条 Dockerfile 优化惯例。\n2. 容器的数据为什么默认易失？两种挂载方式的区别与场景？\n3. `-p 8080:80` 的方向？映射是给谁访问用的？\n4. Compose 中服务间如何互访？`depends_on` 的局限？\n5. 幂等性是什么？为什么 Ansible/声明式系统看重它？\n6. Prometheus/Grafana/Alertmanager 的分工与数据流？\n7. Loki 与 Elasticsearch 的取舍？\n8. CI 与 CD 的分界？为什么部署前要有审批环节？\n\n## 二、实操（每题 10 分，共 40 分）\n\n9. 写 Dockerfile 构建 Flask 应用（slim 基础镜像、非 root、依赖分层），构建并运行验证。\n10. Compose 编排 app+db+cache 三服务并互相联通（写出 yml 与验证命令）。\n11. K8s：部署 nginx Deployment ×2 + NodePort Service，完成「杀 Pod 自愈」与「扩缩容」实验（命令+观察记录）。\n12. Compose 起监控三件套，Grafana 导入 1860 看板并查询本机内存使用率（PromQL）。\n\n## 三、场景（每题 10 分，共 20 分）\n\n13. 生产 Docker 磁盘 92%，`docker system df` 显示镜像占大头——清理方案与防复发措施？\n14. 你的容器应用连不上 Compose 里的 MySQL（报 1045/连接拒绝）——给出排查清单。\n\n---\n\n## 参考答案要点\n\n**1.** 变动少的层在前（依赖清单先 COPY）、代码后 COPY；slim/alpine 基础镜像、多阶段构建、固定版本 tag、非 root USER。（第 02 讲）\n**2.** 容器写层随容器删除消失；volume（Docker 管理寿命）vs bind mount（宿主路径，开发调试）。（第 01 讲）\n**3.** 宿主:容器；给宿主外部访问用，服务间互访走网络别名不走映射。（第 01/02 讲）\n**4.** 服务名即主机名（自建网络）；depends_on 只保证启动顺序不等就绪——应用侧重试。（第 02 讲）\n**5.** 描述期望状态，重复执行结果一致；防止配置漂移与人工差异。（第 04 讲）\n**6.** exporter 暴露 /metrics → Prometheus 拉取存时序 → Grafana 可视化 → Alertmanager 分级告警。（第 05 讲）\n**7.** Loki 只索引标签成本低、按标签查；ES 全文检索强但资源重——按日志量与检索需求选。（第 07 讲）\n**8.** CI 到「构建+测试+产物」；CD 到「部署」；审批防未验证变更直接进生产。（第 05 讲）\n**9.** 参考阶段 5 第 02 讲 Dockerfile；验证 `docker run -d -p 8000:8000` + curl。（第 02 讲）\n**10.** 参考 docker-compose.yml（environment 传 DB_HOST=db）；验证 `compose exec app ping db`。（第 02 讲）\n**11.** `kubectl create deployment/scale/delete pod` + 观察自愈；NodePort 范围 30000~32767。（第 06 讲）\n**12.** 1860 看板；PromQL：`100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))*100`、内存按 used/total。（第 05 讲）\n**13.** `docker system prune -a`（确认无用镜像）→ 镜像仓库配保留策略 → 定期 prune 挂 cron → 监控 docker system df 告警。（第 01 讲）\n**14.** 服务名对不对（不是 localhost）→ MySQL 是否 ready（depends_on 不等就绪）→ 账号密码/主机白名单（app@'%' vs app@'localhost'）→ 网络是否同 compose 网络。逐条 `compose exec app` + `db` 验证。（第 02 讲）\n\n## 评分与处置\n\n≥80 完成；**K8s 与 Compose 实操必须有真实执行记录**。\n", "lessons/阶段6_求职冲刺/01_面试八股速览.md": "---\n类型: 学习讲义\n阶段: 6\n标签: [学习讲义, 面试, 八股]\n---\n\n# 面试八股速览\n\n> 阶段笔记：[[阶段6_求职冲刺]] ｜ 上一讲：[[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD概念]] ｜ 下一讲：[[阶段6_求职冲刺/02_故障排查四套话术|故障排查四套话术]]\n> 用法：每题**先自己答 → 对照答案 → 答不出回对应讲义重学**。深入原理见 [[小林coding_快照索引]]。\n\n## Linux 系统类\n\n| 问题 | 答案要点（30 秒版） |\n|---|---|\n| 服务器负载高怎么查？ | `uptime` 看负载 → `top` 找进程（P/M 排序）→ 进程级定位：CPU 高看代码/死循环，IO 高用 `iostat`/`iotop` |\n| 查看端口占用 | `ss -tlnp` / `lsof -i:80`；杀进程 `kill PID`（先 15 后 9） |\n| 软链接 vs 硬链接 | 硬链接同 inode 多名字，不能跨文件系统不能指目录；软链接是路径快捷方式，原文件删则失效 |\n| 755 是什么权限 | 所有者 rwx，组和其他 r-x；目录 755 + 文件 644 是常见基线 |\n| inode 是什么 | 文件元数据+数据指针；`df -i` 看用量；小文件海把 inode 耗尽写入失败 |\n| 静态库/动态库、PATH 失效 | 简述即可；PATH 覆盖导致命令全失灵是经典事故题 |\n\n## 网络类\n\n| 问题 | 答案要点 |\n|---|---|\n| 三次握手四次挥手 | SYN → SYN+ACK → ACK；FIN → ACK → FIN → ACK；TIME_WAIT 2MSL 防旧包，主动关闭方停留 |\n| OSI/TCP-IP 模型 | 物理链路网络传输应用（TCP-IP 四层）；每层一个代表设备/协议 |\n| DNS 解析过程 | hosts → 本地 DNS → 根 → 顶级域 → 权威；递归+迭代 |\n| 502 vs 504 | 502=后端返回无效（挂了）；504=后端超时没回——都查 upstream 与日志 |\n| HTTP 与 HTTPS | HTTPS=TLS 握手（证书/密钥协商）+对称加密；证书校验：域名/有效期/CA 链 |\n\n## 数据库与中间件\n\n| 问题 | 答案要点 |\n|---|---|\n| MySQL 备份方式 | mysqldump 逻辑备份（--single-transaction）vs 物理备份；备份必须可恢复演练 |\n| 慢查询优化思路 | 开 slow log → EXPLAIN 看执行计划（索引/type/rows）→ 加索引/改写 SQL |\n| Redis 持久化 | RDB 快照恢复快丢数据多；AOF 追加命令丢数据少；生产两者并用 |\n| Redis 缓存三问题 | 穿透（查不存在的 key：布隆/空值缓存）、击穿（热 key 过期：互斥重建）、雪崩（批量同过期：随机 TTL） |\n| MySQL 主从原理 | binlog → 从库 IO 线程拉取 → relay log → SQL 线程重放 |\n\n## Docker 与自动化\n\n| 问题 | 答案要点 |\n|---|---|\n| 镜像和容器 | 镜像只读分层模板；容器=镜像运行实例（进程级隔离）；数据持久用 volume |\n| Dockerfile 优化 | 分层缓存（依赖先拷代码后拷）、多阶段构建、固定版本、非 root、slim 基础镜像 |\n| Compose/K8s 区别 | Compose 单机编排；K8s 跨节点调度/自愈/扩缩容（Deployment/Service/Pod 三概念能讲清） |\n| Ansible 幂等 | 描述期望状态，模块自动判断差异；跑 N 遍结果一致 |\n| CI/CD 流程 | push → 构建测试 → 镜像 → 部署（审批）；工具 GitHub Actions/Jenkins |\n\n## 系统性与开放题\n\n- **服务 CPU 100% 怎么处理**：见 [[阶段6_求职冲刺/02_故障排查四套话术]]（按 STAR 讲）\n- **如何设计一个监控体系**：指标（USE/RED）→ 采集（exporter）→ 告警分级 → 值班响应；先讲思路再讲工具\n- **上线前检查清单**：备份、回滚方案、灰度/低峰、监控告警就位、变更记录\n\n## 动手实验\n\n- [ ] 每类抽 3 题脱稿录音自答，回听找「说不清楚」的点\n- [ ] 整理自己的 20 题高频清单存入 `01_Notes\\认证备考\\`\n- [ ] 牛客面经刷 20 篇，把没见过的题补进清单\n\n## 延伸\n\n- 快照：[[小林coding_快照索引]]（四套图解=八股原理库）、[[牛客运维面经]]（一手面经）\n- 下一讲：面试的核心实战题 → [[阶段6_求职冲刺/02_故障排查四套话术|故障排查四套话术]]\n\n---\n*相邻：[[阶段5_Docker与自动化/05_监控与CI_CD概念|← 上一讲]] ｜ [[阶段6_求职冲刺/02_故障排查四套话术|下一讲 →]]*\n", "lessons/阶段6_求职冲刺/02_故障排查四套话术.md": "---\n类型: 学习讲义\n阶段: 6\n标签: [学习讲义, 面试, 排错]\n---\n\n# 故障排查四套话术\n\n> 阶段笔记：[[阶段6_求职冲刺]] ｜ 上一讲：[[阶段6_求职冲刺/01_面试八股速览|面试八股速览]] ｜ 下一讲：[[阶段6_求职冲刺/03_简历与面试指南|简历与面试指南]]\n> 面试必考：「网站变慢你怎么处理？」——考察的不是命令，是**有序的排查思维**。每套话术 = 分层定位 + 常用命令 + 处置动作。四套都要在 WSL 里实际演练过。\n\n## 通用开场（每套都用）\n\n1. **确认现象**：范围（全部/部分用户？）、时间点（何时开始？有无变更？）、影响面；\n2. **分层定位**：网络 → 系统 → 应用 → 依赖；\n3. **先止血后根因**：能重启/回滚先恢复业务，保留现场再深挖。\n\n## 套路一：网站变慢 / 无法访问\n\n```\n① 检查自己能不能复现：curl -w 状态码+耗时\n② 网络层：ping/traceroute 分段；DNS 解析对不对\n③ 系统层：top(CPU) → free(内存) → df -h(磁盘) → iostat(IO)\n④ 应用层：nginx access/error 日志 → 慢请求在什么接口 → upstream 状态\n⑤ 依赖层：数据库/缓存慢查询（slow log）→ 联动开发\n处置：扩容/限流/重启依赖，恢复后写复盘\n```\n\n**命令**：`curl -sS -o /dev/null -w \"%{http_code} %{time_total}\\n\"`、`top`、`df -h`、`ss -tan | awk '{print $1}' | sort | uniq -c`。\n\n## 套路二：CPU 飙高 100%\n\n```\n① top → P 排序锁定进程\n② 进程内定位：top -H -p PID 看线程 / 或 strace -p PID 抓系统调用\n③ 常见根因：死循环、正则回溯、GC 频繁、进程数暴涨\n④ 处置：确认业务后重启进程；代码问题转开发\n```\n\n**命令**：`ps aux --sort=-%cpu | head`、`top -H -p PID`、`pidstat -u 1`。\n\n## 套路三：磁盘满\n\n```\n① df -h 找满的挂载点 → du -sh /* 逐层下钻找大目录\n② 高频元凶：日志疯长、core dump、docker 镜像堆积、数据库 binlog\n③ 处置：日志清理(确认后)/docker system prune/rotate binlog\n④ 根治：logrotate 配置、监控告警（85% 告警线）\n```\n\n**命令**：`df -h`、`du -xh --max-depth=2 /`、`docker system df`；**注意**：删除被进程占用的文件不释放空间 → `lsof | grep deleted` → 重启对应进程。\n\n## 套路四：端口不通 / 连接超时\n\n```\n① 分层：ping IP → dig 域名 → nc -zv 端口 → curl 应用\n② 本机监听：ss -tlnp 看服务是否 LISTEN\n③ 中间层：防火墙 ufw status / 云安全组 / 负载均衡健康检查\n④ 处置：按层修复（服务起/防火墙放行/安全组加规则）\n```\n\n**命令**：`ss -tlnp`、`nc -zv host port`、`sudo ufw status`、`journalctl -u 服务名`。\n\n## 动手实验（每套都亲手制造一次故障）\n\n- [ ] CPU 飙高：`while true; do :; done &` → top 定位 → kill\n- [ ] 磁盘满（WSL 演练）：`fallocate -l 5G bigfile` → df/du 定位 → 删除\n- [ ] 端口不通：stop nginx → nc 探测失败 → start 恢复\n- [ ] 网站变慢：给 app.py 加 `time.sleep(2)` → curl 耗时变化 → 定位 → 恢复\n- [ ] 四套话术各写成 Markdown 存入 `05_References\\速查手册\\故障排查\\`\n\n## 常见坑（面试表达层面）\n\n- **上来就报命令**：先讲思路框架再讲命令，面试官要的是有序性；\n- **不会说「不知道」**：超出范围时讲「我会按 XX 思路去定位」比胡编强；\n- **没提「保留现场」**：生产故障先止血但留存证据（日志/截图），体现工程素养；\n- **没提复盘**：结尾补一句「事后写复盘、补监控告警」，闭环。\n\n## 自测\n\n1. 四套话术各自的第一步是什么？共同的开场三问是什么？\n2. 磁盘满删除文件后空间没释放，为什么？怎么查？\n3. CPU 飙高如何从进程定位到线程再到代码？\n4. 「网站变慢」如何区分是网络问题还是应用问题？\n\n## 延伸\n\n- 快照：[[小林coding_快照索引|《图解系统/网络》对应章节]]、[[牛客运维面经|牛客「网站变慢」场景题]]\n- 下一讲：把项目与话术写成简历 → [[阶段6_求职冲刺/03_简历与面试指南|简历与面试指南]]\n\n---\n*相邻：[[阶段6_求职冲刺/01_面试八股速览|← 上一讲]] ｜ [[阶段6_求职冲刺/03_简历与面试指南|下一讲 →]]*\n", "lessons/阶段6_求职冲刺/03_简历与面试指南.md": "---\n类型: 学习讲义\n阶段: 6\n标签: [学习讲义, 求职, 简历, 面试]\n---\n\n# 简历与面试指南\n\n> 阶段笔记：[[阶段6_求职冲刺]] ｜ 上一讲：[[阶段6_求职冲刺/02_故障排查四套话术|故障排查四套话术]] ｜ 下一讲：（课程终点，冲！）\n> 2026 初级运维岗行情基准：**Linux 扎实 + Docker/K8s 会用 + 监控（Prometheus/ELK）+ CI/CD + 脚本**。你的两个项目正好逐条覆盖。\n\n## 学习目标\n\n- 写出「关键词全覆盖 + 项目 STAR 化」的简历\n- 准备好两个项目的 5 分钟讲述与追问弹药库\n- 建立投递与复盘的迭代流程\n\n## 核心概念：简历结构（一页为准）\n\n```\n① 基本信息（姓名/电话/邮箱/城市，一句话意向）\n② 技能清单（6~8 条，每条=技能+程度佐证）\n   例：熟练 Linux 系统管理（用户/权限/进程/日志），可独立完成生产巡检与故障定位\n③ 项目经历（STAR 化，两个项目各 4~6 行）\n④ 教育/证书（软考等加分项）\n```\n\n**技能关键词对照 2026 JD**：Linux、Shell、Python、Docker、Kubernetes(了解)、Nginx、MySQL、Redis、Prometheus/Grafana、ELK(概念)、CI/CD、Git、Ansible。\n\n### 项目 STAR 化示范（项目①）\n\n```\nS 背景：搭建一套可复现的 Web 服务环境用于学习与演示\nT 任务：负责 Nginx/MySQL/Redis/Flask 的部署、备份与监控\nA 行动：\n  - Nginx 反向代理 + systemd 托管 gunicorn 应用\n  - 编写备份脚本（mysqldump --single-transaction + 定时清理），并完成恢复演练\n  - 建立安全基线（ufw 最小暴露面 / SSH 密钥登录 / 服务自动拉起巡检）\n  - 全流程文档化，git tag 版本化管理\nR 结果：环境 1 小时内可从零重建；磁盘/服务告警脚本上线，演练 3 类故障全部按预案恢复\n```\n\n项目②（容器化）强调：**Dockerfile 分层优化、Compose 编排、镜像固定版本、down -v 卷生命周期理解**。\n\n## 命令实操（其实是「材料准备实操」）\n\n```bash\n# 1) 项目②产出物固化（面试可展示）\ncd /opt/lnmp && docker compose config > 最终生效配置.yml    # 导出编排\ngit log --oneline > 变更历史.txt                            # 证明工程化\n# 2) 素材整理进 06_Projects\\，简历里每个数字/结论都要有出处\n```\n\n**投递渠道**：BOSS/拉勾/猎聘 + 牛客内推；**投递节奏**：先投 5 家非目标公司练手感，复盘简历后集中投目标。\n\n## 动手实验\n\n- [ ] 按 STAR 模板完成两个项目的简历段落，对照 10 份真实 JD 逐条勾关键词\n- [ ] 准备「追问弹药库」：每个项目预设 5 个追问（为什么选 gunicorn？备份怎么验证？Compose 数据卷？），答案写全\n- [ ] 模拟面试 3 轮：让 AI/朋友按 [[阶段6_求职冲刺/01_面试八股速览|八股清单]] + 02 话术提问，录屏复盘\n- [ ] 每次面试后 24h 内写复盘：被问倒的题 → 补进八股清单 → 下轮消灭\n\n## 常见坑（求职行为层面）\n\n- **简历写「了解/熟悉」堆满**：写什么都可能被问——只写能扛住追问的；\n- **项目只有名词没有数字**：加「1 小时重建」「告警上线后故障平均定位 <15 分钟」这类可验证结果；\n- **不问清楚岗位再投**：先看 JD 关键词（有的岗偏桌面运维/机房值守，与你的方向不同）；\n- **面完不复盘**：每轮面试都是免费的真题，浪费即损失。\n\n## 自测\n\n1. 你的简历关键词清单里，哪几个能被 JD 全覆盖？哪几个缺口？\n2. 项目①的 STAR 四段各是什么？（脱稿说）\n3. 「追问弹药库」为什么要提前写？举一个最可能的追问。\n\n## 延伸\n\n- 快照：[[牛客运维面经|牛客运维面经合集（一手真题）]]、[[小林coding_快照索引]]\n- 课程终点：回到 [[学习主页]] 更新打卡表 → 带着这套资料库出发 🚀\n\n---\n*相邻：[[阶段6_求职冲刺/02_故障排查四套话术|← 上一讲]] ｜ （全部 30 讲完，毕业！）*\n", "lessons/阶段6_求职冲刺/99_阶段6测试卷.md": "---\n类型: 阶段测试卷\n阶段: 6\n标签: [学习讲义, 测试, 求职]\n---\n\n# 阶段 6 测试卷：求职冲刺（口试模拟）\n\n> 本卷不是笔试：**找人（或 AI）扮演面试官**，随机抽 8 题，每题 2 分钟口头作答并录音复盘。通过标准：8 题中 6 题结构清晰、无冷场、无编造。\n\n## 抽题池（按面试官偏好分组）\n\n### A 组：基础八股（抽 2）\n\n1. 负载高怎么排查？说出完整思路与命令。\n2. 三次握手四次挥手（画出来讲一遍）。\n3. 502/504/500 的区别与排查方向。\n4. 硬链接软链接区别；inode 耗尽事故怎么处理。\n\n### B 组：场景实战（抽 2）\n\n5. 网站突然变慢，你到场后前 10 分钟做什么？\n6. 磁盘满了，删除大日志后空间没释放，为什么？怎么处理？\n7. 服务连不上数据库，你的排查清单？\n8. 讲一次你处理过的故障（用你的项目经历，STAR 结构）。\n\n### C 组：容器与自动化（抽 2）\n\n9. 容器和虚拟机的区别？容器的数据持久化怎么做？\n10. Dockerfile 怎么优化？镜像分层原理？\n11. Compose 和 K8s 的定位差异？Pod/Deployment/Service 是什么？\n12. CI/CD 流水线各阶段？为什么部署要审批？\n\n### D 组：方案与协作（抽 2）\n\n13. 如何给一台新服务器做安全基线？\n14. 如何设计一套监控告警体系（指标选择/分级/值班）？\n15. 备份策略怎么设计？怎么证明备份有效？\n16. 开发说「服务没问题，是运维的问题」，你怎么推进？\n\n## 参考答题框架（面试官视角的评分点）\n\n- **结构化**：先框架后细节（「我按分层排查：先网络、再系统、再应用」）；\n- **有证据**：每步带命令与预期输出，不空谈；\n- **有闭环**：处置 → 复盘 → 监控补强；\n- **诚实**：没做过就说「思路是……，实际没操作过，但我可以现场学」。\n- 16 题详解：13 → [[阶段4_服务实战/05_运维方案_备份监控与安全|运维方案]] ｜ 14 → [[阶段5_Docker与自动化/05_监控与CI_CD概念|监控与CI/CD]] ｜ 15 → [[阶段3_Shell脚本/04_综合实战_备份与巡检脚本|备份实战]] ｜ 16 → 协作：拿数据说话（日志/监控截图）+ 共同复现 + 明确责任边界。\n\n## 记录表\n\n| 题号 | 自评 | 卡点 | 补学去向 |\n|---|---|---|---|\n| | | | |\n\n> 3 轮模拟全部 ≥6/8 后，进入投递。参见 [[阶段6_求职冲刺/03_简历与面试指南|简历与面试指南]]。\n"}, "levels": [{"path": "lessons/阶段0_环境搭建/01_WSL与工作流搭建.md", "kind": "lesson", "phase": 0}, {"path": "lessons/阶段1_Linux基础/01_文件与目录操作.md", "kind": "lesson", "phase": 1}, {"path": "lessons/阶段1_Linux基础/02_vim与文件查看.md", "kind": "lesson", "phase": 1}, {"path": "lessons/阶段1_Linux基础/03_用户权限与文件系统.md", "kind": "lesson", "phase" function renderHeat(){

  const w = progress.wrong.find(x => x.k === key);

  else { if (w) { w.w += 1; w.due = Date.now() + 86400000; } }
  save_();
  const btn = box.parentElement.querySelector(".btn");
  if (btn) { btn.textContent = "下一题 →"; btn.onclick = () => renderReview(); }
}

/* ================= 文档打开 ================= */
function splitFM(text) {
  if (!text.startsWith("---")) return { meta: {}, body: text };
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (!m) return { meta: {}, body: text };
  const meta = {};
  m[1].split(/\r?\n/).forEach(l => { const i = l.indexOf(":"); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  return { meta, body: text.slice(m[0].length) };
}
function preprocess(md) {
  md = md.replace(/\[\[([^\]|#]+)(#[^\]|]+)?(?:\|([^\]]+))?\]\]/g, (m, tgt, _h, disp) => {
    const p = byBase[tgt.trim()]; const d = (disp || tgt).trim();
    return p ? `[${d}](#/${encodeURI(p)})` : `<span class="wl-miss" title="库内未收录：${tgt.trim()}">${d}</span>`;
  });
  md = md.replace(/\[([^\]]+)\]\(([^)#\s]+\.md)\)/g, (m, disp, rel) => {
    const dir = state.cur.split("/").slice(0, -1).join("/");
    const abs = (dir ? dir + "/" : "") + rel.replace(/^\.\//, "");
    return byPath[abs] ? `[${disp}](#/${encodeURI(abs)})` : `${disp}（本地未收录）`;
  });
  return md;
}
async function openDoc(path, push = true) {

  qz.questions.forEach((q, i) => {

function submitQuiz(path) {
  const qz = QUIZZES[path];
  let right = 0;
  qz.questions.forEach((q, i) => {
    const box = document.getElementById("qq" + i);
    const sel = box.querySelector("input:checked");
    const val = sel ? +sel.value : -1;
    box.querySelectorAll("label").forEach((lb, j) => {
      if (j === q.a) lb.classList.add("ok");
      else if (j === val) lb.classList.add("no");
    });
    box.classList.add("done");
    if (val === q.a) right++; else if (val !== -1) addWrong(path, i);
  });
  const pass = right >= qz.pass;
  const res = document.getElementById("qres");
  if (pass) { resolveAllWrong(path); completeLevel(path, right); res.innerHTML = `🎉 答对 ${right}/${qz.questions.length} —— 通关！+100 XP，下一关已解锁`; res.style.color = "var(--ok)"; }
  else { res.innerHTML = `❌ 答对 ${right}/${qz.questions.length}（需 ${qz.pass}）—— 错题已进错题本，去「复习」重练`; res.style.color = "var(--bad)"; }

  } catch (e) {
    clearTimeout(watch);
    const diag = `levels=${(LEVELS||[]).length} groups=${(state.groups||[]).length} keys=${PORTAL_DATA ? Object.keys(PORTAL_DATA).join("+") : "null"}`;
    $("#viewbox").innerHTML = `<div class="wrap"><div class="err" style="padding:24px"><b>启动失败：${e.message}</b><br><span style="font-size:12px;color:#697586">诊断: ${diag}</span><br><br>请刷新页面重试；若反复出现请重新运行 启动学习门户.bat 重建离线包。</div></div>`;
  }
})();
</script>
</body>
</html>
